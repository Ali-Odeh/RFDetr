[project]
name = "multispector-rfdetr-poc"
version = "0.1.0"
description = "Jupyter-first RF-DETR Segmentation Nano POC for wheat grain inspection"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.12,<4",
    "ipykernel>=6.30,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "opencv-python>=4.11,<5",
    "pandas>=2.2,<4",
    "pillow>=11,<13",
    "psutil>=6.1,<9",
    "pyyaml>=6,<7",
    "rfdetr[train,visual]==1.9.3",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<1",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
